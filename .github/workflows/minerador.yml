# Robô do Minerador rodando de graça no GitHub Actions.
# - 4 vezes por dia: rotina (pedidos da fila, recontagem das páginas, rodízio de nichos/países/gateways).
# - Sob demanda: o botão "Minerar agora" do painel na Vercel aciona este workflow com tarefa=fila.
name: minerador

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'   # 0h17, 6h17, 12h17 e 18h17 (Brasília). Repositório público: minutos ilimitados
  workflow_dispatch:
    inputs:
      tarefa:
        description: 'rotina (completa) ou fila (só os pedidos do painel)'
        default: 'rotina'

concurrency:
  group: minerador
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache do modelo de busca por significado
        uses: actions/cache@v4
        with:
          path: .cache/modelos
          key: modelo-e5-small-v1
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Rodar tarefa
        run: node --no-warnings src/tarefa.js ${{ github.event.inputs.tarefa || 'rotina' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIMITE_PAGINAS_EXECUCAO: ${{ vars.LIMITE_PAGINAS_EXECUCAO || '500' }}
