<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Minerador: opções</title>
<style>
  body { font: 14px/1.5 Inter, system-ui, Arial, sans-serif; max-width: 520px; margin: 32px auto; color: #101828; padding: 0 16px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font: inherit; box-sizing: border-box; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 6px; background: #1f5eff; color: #fff; font-weight: 600; cursor: pointer; }
  #msg { margin-top: 12px; } .ok { color: #067647; } .erro { color: #b42318; } .mut { color: #667085; font-size: 12.5px; }
</style>
</head>
<body>
  <h1 style="font-size:20px">Minerador · extensão</h1>
  <p class="mut">Copie os dois valores em Configurações → Extensão do Chrome, no seu painel.</p>
  <label for="url">Endereço do painel</label>
  <input id="url" placeholder="https://seu-minerador.vercel.app">
  <label for="chave">Sua chave</label>
  <input id="chave" placeholder="cole a chave aqui">
  <button id="salvar">Salvar e testar</button>
  <div id="msg"></div>
  <p class="mut" style="margin-top:24px">Depois abra a Biblioteca de Anúncios: cada anunciante ganha um selo com o número de anúncios na tela e os botões "Salvar" e "Analisar site".</p>
  <script src="opcoes.js"></script>
</body>
</html>
